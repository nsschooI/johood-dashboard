name: Build JoHood Macro

on:
  push:
    paths:
      - 'macro-app/**'
  workflow_dispatch:   # يخليك تشغّله يدوياً بضغطة زر

permissions:
  contents: write

concurrency:
  group: build-macro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: macro-app
        run: npm install

      - name: Build Windows app
        working-directory: macro-app
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Read app version
        id: pkg
        working-directory: macro-app
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: JoHood-Macro-Portable
          path: macro-app/release/JoHood_Macro_Portable.exe
          retention-days: 30

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: JoHood-Macro-Installer
          path: macro-app/release/*.exe
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: JoHood Macro v${{ steps.pkg.outputs.version }}
          make_latest: true
          files: |
            macro-app/release/*.exe
            macro-app/release/*.blockmap
            macro-app/release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
