name: Build JoHood Macro

on:
  push:
    paths:
      - 'macro-app/**'
  workflow_dispatch:   # يخليك تشغّله يدوياً بضغطة زر

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: macro-app
        run: npm install

      - name: Build Windows app
        working-directory: macro-app
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: JoHood-Macro-Portable
          path: macro-app/release/JoHood_Macro_Portable.exe
          retention-days: 30

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: JoHood-Macro-Installer
          path: macro-app/release/*.exe
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: JoHood Macro v1.0.0
          files: |
            macro-app/release/JoHood_Macro_Portable.exe
            macro-app/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
