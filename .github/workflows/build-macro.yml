name: Build JoHood Macro

on:
  push:
    paths:
      - 'macro-app/**'
    branches:
      - main
      - master
  workflow_dispatch:   # يخليك تشغّله يدوياً بضغطة زر

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: macro-app/package-lock.json

      - name: Install dependencies
        working-directory: macro-app
        run: npm install

      - name: Build Windows app
        working-directory: macro-app
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: JoHood-Macro-Portable
          path: macro-app/release/JoHood_Macro_Portable.exe
          retention-days: 30

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: JoHood-Macro-Installer
          path: macro-app/release/*.exe
          retention-days: 30
